services:
  # Database quan hệ
  postgres:
    image: postgres:15-alpine
    container_name: fullstack-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caching layer
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    ports:
      - "6379:6379"

  # Object Storage (Tương thích S3)
  minio:
    image: minio/minio
    container_name: fullstack-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console (Giao diện quản lý)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: